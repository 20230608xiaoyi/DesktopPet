[package]
name = "desktop-pet"
version = "0.4.0"
description = "桌宠 AI 智伴 · 貔貅皮皮"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }
msedge-tts = { version = "0.4", default-features = false, features = ["tokio-runtime"] }
# 显式管理 rustls CryptoProvider：依赖图中 ring 与 aws-lc-rs 并存，需手动安装默认后端
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
log = "0.4"

# ---- 桌面专属依赖（Android 构建时不会编译）----
# 注意：cargo 不认识 tauri 注入的 cfg(desktop)，target 表必须用原生 cfg 写法
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
arboard = "3"
tauri-plugin-autostart = "2"

# ---- Android 专属依赖：悬浮桌宠本地插件（Rust 桥 + Kotlin Service）----
[target."cfg(target_os = \"android\")".dependencies]
tauri-plugin-petfloat = { path = "plugins/petfloat" }
# rustls-platform-verifier 在 Android 需要运行时 JNI 初始化（TLS 证书校验）
rustls-platform-verifier = "0.7"
jni = "0.22"
ndk-context = "0.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
